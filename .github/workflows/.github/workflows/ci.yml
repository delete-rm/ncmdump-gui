name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build (no release)
        run: |
          chmod +x build.sh
          ./build.sh --no-launch "$RUNNER_TEMP/ncmdump.app"

      - name: Smoke test
        run: |
          codesign -v "$RUNNER_TEMP/ncmdump.app"
          lipo -info "$RUNNER_TEMP/ncmdump.app/Contents/MacOS/NCMDump"
          "$RUNNER_TEMP/ncmdump.app/Contents/Resources/ncmdump" -v
          plutil -lint "$RUNNER_TEMP/ncmdump.app/Contents/Info.plist"
